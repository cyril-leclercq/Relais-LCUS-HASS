# Configuration Home Assistant pour Volet Roulant via Relais USB
#
# À ajouter dans votre configuration.yaml ou dans un fichier séparé
# inclus via: cover: !include covers.yaml

# ⚠️ DOCKER: Voir DOCKER_SETUP.md pour la configuration complète
# - Mapper le device USB dans docker-compose.yml
# - Installer pyserial dans le conteneur
# - Copier les scripts dans /config/scripts/relais/

# CONFIGURATION DU PORT USB
# Méthode 1 (recommandée): Définir le port USB comme variable d'environnement
# Dans le fichier /etc/systemd/system/home-assistant@homeassistant.service (Linux)
# ou dans le fichier de configuration de votre installation Home Assistant, ajoutez:
# Environment="RELAIS_USB_PORT=/dev/ttyUSB0"
#
# Méthode 2Créer un input_text pour configurer le port USB
input_text:
  volet_usb_port:
    name: Port USB du volet roulant
    initial: /dev/tty.usbserial-1110
    icon: mdi:usb-port
    # Valeurs courantes:
    # macOS: /dev/tty.usbserial-1110
    # Linux: /dev/ttyUSB0
    # Windows: COM3

# ÉTAPE 3: : Définir directement dans les commandes ci-dessous en ajoutant:
# RELAIS_USB_PORT=/dev/ttyUSB0 avant chaque commande python

# ÉTAPE 1: Définir les commandes shell
shell_command:
  volet_monter: "RELAIS_USB_PORT={{ states('input_text.volet_usb_port') }} /usr/bin/python3 /home/user/Relais-LCUS-HASS/volet_monter.py {{ duree|default(30) }}"
  volet_descendre: "RELAIS_USB_PORT={{ states('input_text.volet_usb_port') }} /usr/bin/python3 /home/user/Relais-LCUS-HASS/volet_descendre.py {{ duree|default(30) }}"
  volet_arreter: "RELAIS_USB_PORT={{ states('input_text.volet_usb_port') }} /usr/bin/python3 /home/user/Relais-LCUS-HASS/volet_arreter.py"

# ÉTAPE 2: Définir le cover (volet roulant)
cover:
  - platform: template
    covers:
      volet_roulant:
        device_class: shutter
        friendly_name: "Volet Roulant"
        
        # Commande pour ouvrir (monter)
        open_cover:
          service: shell_command.volet_monter
          data:
            duree: 30  # Ajuster selon votre volet
        
        # Commande pour fermer (descendre)
        close_cover:
          service: shell_command.volet_descendre
          data:
            duree: 30  # Ajuster selon votre volet
        
        # Commande pour arrêter
        stop_cover:
          service: shell_command.volet_arreter
        
        # Optionnel: icône personnalisée
     Configurez le port USB via l'entité input_text.volet_usb_port dans l'interface
# 4. Pour tester les commandes manuellement:
#    - service: shell_command.volet_monter
#    - service: shell_command.volet_descendre
#    - service: shell_command.volet_arreter
# 5. Pour trouver votre port USB:
#    - Linux/macOS: ls /dev/tty* | grep -i usb
#    - Python: python3 -m serial.tools.list_ports
            mdi:window-shutter
          {% endif %}

# NOTES:
# 1. Remplacez les chemins absolus par les chemins corrects de votre installation
# 2. Ajustez la durée (30 secondes par défaut) selon le temps nécessaire pour 
#    ouvrir/fermer complètement votre volet
# 3. Pour tester les commandes manuellement:
#    - service: shell_command.volet_monter
#    - service: shell_command.volet_descendre
#    - service: shell_command.volet_arreter
